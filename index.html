<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h2>Calculator</h2>
    <div id="display"></div>
    <div id="container">
        <div id="calcContainer">
            <button class="calcBtns" id="prevAnswer">Ans</button>
            <button class="calcBtns" id="clearBtn">Clear</button>
            <button class="calcBtns" id="deleteBtn">Delete</button>
            <button class="calcBtns opsBtn">/</button>
            <button class="calcBtns numBtn">7</button>
            <button class="calcBtns numBtn">8</button>
            <button class="calcBtns numBtn">9</button>
            <button class="calcBtns opsBtn">*</button>
            <button class="calcBtns numBtn">4</button>
            <button class="calcBtns numBtn">5</button>
            <button class="calcBtns numBtn">6</button>
            <button class="calcBtns opsBtn">-</button>
            <button class="calcBtns numBtn">1</button>
            <button class="calcBtns numBtn">2</button>
            <button class="calcBtns numBtn">3</button>
            <button class="calcBtns opsBtn">+</button>
            <button class="calcBtns numBtn">0</button>
            <button class="calcBtns" id="decimalBtn">.</button>
            <button class="calcBtns" id="equalBtn">=</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
